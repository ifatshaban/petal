<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Petal</title>
  <meta name="description" content="Your daily games in one place.">
  <meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Petal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.8l4.1 4.2L18.8 6.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></symbol>
  </svg>

  <nav class="toolbar">
    <button id="editBtn" class="tool">Edit</button>
    <span class="grow"></span>
    <button id="addBtn" class="tool">Add</button>
    <button id="menuBtn" class="tool">Menu</button>
  </nav>

  <header class="masthead">
    <div class="folio"><span id="folioNo"></span><span id="folioDate"></span></div>
    <h1 class="nameplate">Petal</h1>
    <p class="tagline">The daily round of puzzles</p>
  </header>

  <section class="round" aria-live="polite">
    <p id="roundText"></p>
    <div id="squares" class="squares" aria-hidden="true"></div>
  </section>

  <main id="list"></main>

  <!-- Add / edit game -->
  <dialog id="gameSheet" class="sheet">
    <form id="gameForm">
      <div class="sheet-nav">
        <button type="button" class="tool" data-close>Cancel</button>
        <h2 id="gameSheetTitle">New game</h2>
        <button type="submit" class="ink-btn">Save</button>
      </div>
      <div class="sheet-body">
        <div class="icon-preview"><span id="iconPreview"></span></div>
        <div class="cells">
          <label class="field"><span>Name</span><input name="name" required maxlength="40" placeholder="Wordle" autocomplete="off"></label>
          <label class="field"><span>Link</span><input name="url" required inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="nytimes.com/games/wordle" autocomplete="off"></label>
          <label class="field"><span>Group</span><select name="group" id="groupSelect"></select></label>
        </div>
        <div class="cells">
          <label class="field"><span>Icon</span><input name="icon" placeholder="Automatic" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></label>
        </div>
        <p class="footnote">Leave the icon blank to use the website's own icon, or enter an emoji or an image link.</p>
        <div class="cells" id="deleteGameWrap">
          <button type="button" id="deleteGame" class="cell-btn destructive">Delete this game</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- New / rename group -->
  <dialog id="groupSheet" class="sheet">
    <form id="groupForm">
      <div class="sheet-nav">
        <button type="button" class="tool" data-close>Cancel</button>
        <h2 id="groupSheetTitle">New group</h2>
        <button type="submit" class="ink-btn">Save</button>
      </div>
      <div class="sheet-body">
        <div class="cells">
          <label class="field"><span>Name</span><input name="name" required maxlength="30" placeholder="Morning games" autocomplete="off"></label>
        </div>
        <div class="cells" id="deleteGroupWrap">
          <button type="button" id="deleteGroup" class="cell-btn destructive">Delete this group</button>
        </div>
        <p class="footnote" id="deleteGroupNote"></p>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="menuSheet" class="sheet">
    <div class="sheet-nav">
      <span></span>
      <h2>Settings</h2>
      <button type="button" class="ink-btn" data-close>Done</button>
    </div>
    <div class="sheet-body">
      <div class="cells">
        <label class="cell-row"><span>Move solved games down</span><input type="checkbox" class="switch" id="sortPlayed"></label>
        <label class="cell-row"><span>Hide solved games</span><input type="checkbox" class="switch" id="hidePlayed"></label>
      </div>
      <div class="cells">
        <button id="suggestBtn" class="cell-btn chev">Suggested games<span aria-hidden="true">→</span></button>
        <button id="newGroupBtn" class="cell-btn chev">New group<span aria-hidden="true">→</span></button>
      </div>
      <div class="cells">
        <button id="exportBtn" class="cell-btn">Export backup</button>
        <button id="importBtn" class="cell-btn">Import backup</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="cells">
        <button id="resetBtn" class="cell-btn destructive">Reset to the default games</button>
      </div>
      <p class="footnote" id="installHint"></p>
    </div>
  </dialog>

  <!-- Suggestions -->
  <dialog id="suggestSheet" class="sheet">
    <div class="sheet-nav">
      <span></span>
      <h2>Suggested games</h2>
      <button type="button" class="ink-btn" data-close>Done</button>
    </div>
    <div class="sheet-body">
      <div class="cells" id="suggestList"></div>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
