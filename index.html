<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Petal</title>
  <meta name="description" content="Your daily games in one place.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Petal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="19" cy="12" r="1.9" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="nav">
    <button id="editBtn" class="text-btn">Edit</button>
    <div class="nav-right">
      <button id="addBtn" class="round-btn" aria-label="Add game"><svg><use href="#i-plus"/></svg></button>
      <button id="menuBtn" class="round-btn" aria-label="Settings"><svg><use href="#i-more"/></svg></button>
    </div>
  </header>

  <section class="hero">
    <h1 id="dayTitle"></h1>
    <p id="daySub"></p>
    <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  </section>

  <main id="list"></main>

  <!-- Add / edit game -->
  <dialog id="gameSheet" class="sheet">
    <form id="gameForm">
      <div class="sheet-nav">
        <button type="button" class="text-btn" data-close>Cancel</button>
        <h2 id="gameSheetTitle">New Game</h2>
        <button type="submit" class="text-btn strong">Save</button>
      </div>
      <div class="sheet-body">
        <div class="icon-preview"><span id="iconPreview"></span></div>
        <div class="cells">
          <label class="field"><span>Name</span><input name="name" required maxlength="40" placeholder="Wordle" autocomplete="off"></label>
          <label class="field"><span>Link</span><input name="url" required inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="nytimes.com/games/wordle" autocomplete="off"></label>
          <label class="field"><span>Group</span><select name="group" id="groupSelect"></select></label>
        </div>
        <div class="cells">
          <label class="field"><span>Icon</span><input name="icon" placeholder="Automatic" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></label>
        </div>
        <p class="footnote">Leave the icon blank to use the website's own icon, or enter an emoji or an image link.</p>
        <div class="cells" id="deleteGameWrap">
          <button type="button" id="deleteGame" class="cell-btn destructive">Delete Game</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- New / rename group -->
  <dialog id="groupSheet" class="sheet">
    <form id="groupForm">
      <div class="sheet-nav">
        <button type="button" class="text-btn" data-close>Cancel</button>
        <h2 id="groupSheetTitle">New Group</h2>
        <button type="submit" class="text-btn strong">Save</button>
      </div>
      <div class="sheet-body">
        <div class="cells">
          <label class="field"><span>Name</span><input name="name" required maxlength="30" placeholder="Morning games" autocomplete="off"></label>
        </div>
        <div class="cells" id="deleteGroupWrap">
          <button type="button" id="deleteGroup" class="cell-btn destructive">Delete Group</button>
        </div>
        <p class="footnote" id="deleteGroupNote"></p>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="menuSheet" class="sheet">
    <div class="sheet-nav">
      <span></span>
      <h2>Settings</h2>
      <button type="button" class="text-btn strong" data-close>Done</button>
    </div>
    <div class="sheet-body">
      <div class="cells">
        <label class="cell-row"><span>Move played games down</span><input type="checkbox" class="switch" id="sortPlayed"></label>
        <label class="cell-row"><span>Hide played games</span><input type="checkbox" class="switch" id="hidePlayed"></label>
      </div>
      <div class="cells">
        <button id="suggestBtn" class="cell-btn chev">Suggested Games<svg><use href="#i-chev"/></svg></button>
        <button id="newGroupBtn" class="cell-btn chev">New Group<svg><use href="#i-chev"/></svg></button>
      </div>
      <div class="cells">
        <button id="exportBtn" class="cell-btn">Export Backup</button>
        <button id="importBtn" class="cell-btn">Import Backup</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="cells">
        <button id="resetBtn" class="cell-btn destructive">Reset to Default Games</button>
      </div>
      <p class="footnote" id="installHint"></p>
    </div>
  </dialog>

  <!-- Suggestions -->
  <dialog id="suggestSheet" class="sheet">
    <div class="sheet-nav">
      <span></span>
      <h2>Suggested Games</h2>
      <button type="button" class="text-btn strong" data-close>Done</button>
    </div>
    <div class="sheet-body">
      <div class="cells" id="suggestList"></div>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
